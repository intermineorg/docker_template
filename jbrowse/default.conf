# Static JBrowse. No X-Frame-Options header is set on purpose: InterMine
# report pages embed this site in an iframe.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css application/json;

    # The JavaScript bundle is versioned with the image, so it can be cached;
    # index.html and the dataset list are revalidated so edits show up at once.
    location /dist/ { expires 7d; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /jbrowse_conf.json { add_header Cache-Control "no-cache"; }
}
