# A single shared JBrowse for any number of InterMines. See docs/jbrowse.md.
#
#   cd jbrowse && docker-compose up -d --build
#
# Publish it behind your TLS-terminating front end as https://jbrowse.<domain>/
# (InterMine's default is https://jbrowse.intermine.org/).
version: "3.4"

services:
  jbrowse:
    container_name: jbrowse
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - ${JBROWSE_HTTP_PORT}:80
